<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <title>Atlas OS — Ouverture</title>
  <link rel="stylesheet" href="./css/atlas-opening.css?v=11">
</head>
<body>
<main class="atlas-opening-app" id="atlasOpeningApp">

  <!-- ████████████████████████████████████████████████████████
       🟦 PARTIE A — A01 — PAGE D’OUVERTURE OFFICIELLE
       ████████████████████████████████████████████████████████ -->
  <section class="atlas-page atlas-page--welcome is-active" data-page="welcome" aria-label="Présentation d’Atlas OS">
    <div class="atlas-welcome">
      <div class="atlas-welcome-glow" aria-hidden="true"></div>
      <img class="atlas-welcome-logo" src="./assets/atlas-os-human-digital-twin.png" alt="Atlas OS — Votre Jumeau Numérique Humain">
      <button class="atlas-welcome-enter" id="atlasEnterButton" type="button">
        Entrer dans Atlas <span aria-hidden="true">→</span>
      </button>
    </div>
  </section>

  <!-- ████████████████████████████████████████████████████████
       🟩 PARTIE B — B01 — CHOIX HOMME / FEMME
       ████████████████████████████████████████████████████████ -->
  <section class="atlas-page atlas-page--avatar" data-page="avatar" aria-label="Choix de l’avatar">
    <div class="atlas-landscape-hint" id="landscapeHint">
      Tournez votre téléphone horizontalement pour profiter du visuel complet.
    </div>

    <div class="atlas-image-stage atlas-image-stage--landscape atlas-avatar-selector" id="avatarStage">
  <div class="atlas-avatar-heading">
    <span>ÉTAPE 1 SUR 5</span>
    <h1>Choisissez votre avatar</h1>
    <p>Il deviendra votre Jumeau Numérique dans tous les moteurs Atlas.</p>
  </div>

  <div class="atlas-avatar-grid">
    <button class="atlas-hotspot atlas-hotspot--male atlas-avatar-card" data-avatar="male" type="button" aria-label="Choisir l’avatar homme">
      <img src="./assets/atlas-avatar-homme-clean-final.png?v=2" alt="Jumeau Numérique Atlas homme">
      <strong>HOMME</strong>
    </button>

    <button class="atlas-hotspot atlas-hotspot--female atlas-avatar-card" data-avatar="female" type="button" aria-label="Choisir l’avatar femme">
      <img src="./assets/atlas-avatar-femme-clean-final.png?v=2" alt="Jumeau Numérique Atlas femme">
      <strong>FEMME</strong>
    </button>
  </div>
</div><div class="atlas-selection-status" id="avatarStatus" aria-live="polite">
      Sélectionnez Homme ou Femme.
    </div>
  </section>


  <!-- ████████████████████████████████████████████████████████
       🟪 PARTIE E — E01 — HUB ATLAS 4.1 FIDÈLE À LA MAQUETTE
       ████████████████████████████████████████████████████████ -->
  <section class="atlas-page atlas-page--hub atlas-hub-final" data-page="hub" aria-label="Atlas Hub">
    <div class="hub-final-stage">
      <img
        id="hubFinalImage"
        class="hub-final-image"
        src="./assets/atlas-hub-cockpit-empty.png"
        alt="Interface Atlas OS autour du Jumeau Numérique"
      >
      <img
        id="hubPersistentAvatar"
        class="hub-persistent-avatar"
        src="./assets/atlas-avatar-homme-clean-final.png?v=2"
        alt="Jumeau Numérique Atlas sélectionné"
      >

      <!-- Zones interactives exactement superposées à la maquette -->
      <button class="hub-final-hotspot hotspot-clinical" data-engine="Clinique" type="button" aria-label="Ouvrir Clinique"></button>
      <button class="hub-final-hotspot hotspot-ai" data-engine="Atlas IA" type="button" aria-label="Ouvrir Atlas IA"></button>
      <button class="hub-final-hotspot hotspot-biomech" data-engine="Biomécanique" type="button" aria-label="Ouvrir Biomécanique"></button>
      <button class="hub-final-hotspot hotspot-performance agent-hotspot agent-hotspot--coach" data-engine="Atlas Coach" type="button" aria-label="Ouvrir Atlas Coach">
        <span class="agent-hotspot__sigil" aria-hidden="true">AC</span>
        <span class="agent-hotspot__identity">
          <strong>Atlas Coach</strong>
          <small>Analyse • Entraînement</small>
          <small>Compétitions • Performance</small>
        </span>
      </button>
      <button class="hub-final-hotspot hotspot-physiology" data-engine="Physiologie" type="button" aria-label="Ouvrir Physiologie"></button>
      <button class="hub-final-hotspot hotspot-prevention" data-engine="Prévention" type="button" aria-label="Ouvrir Prévention"></button>
      <button class="hub-final-hotspot hotspot-memory" data-engine="Mémoire" type="button" aria-label="Ouvrir Mémoire"></button>

      <button class="hub-final-hotspot hotspot-body3d" data-engine="Biomécanique" type="button" aria-label="Ouvrir Corps 3D"></button>
      <button class="hub-final-hotspot hotspot-data" data-engine="Physiologie" type="button" aria-label="Ouvrir Données"></button>
      <button class="hub-final-hotspot hotspot-analysis" data-engine="Atlas IA" type="button" aria-label="Ouvrir Analyses"></button>
      <button class="hub-final-hotspot hotspot-plans" data-engine="Performance" type="button" aria-label="Ouvrir Plans"></button>
      <button class="hub-final-hotspot hotspot-reports" data-engine="Mémoire" type="button" aria-label="Ouvrir Rapports"></button>
      <button class="hub-final-hotspot hotspot-settings" type="button" aria-label="Ouvrir Paramètres"></button>

      <button class="hub-final-hotspot hotspot-brain-action" data-engine="Atlas IA" type="button" aria-label="Ouvrir l'analyse détaillée"></button>
      <button class="hub-final-hotspot hotspot-scanner" data-engine="Biomécanique" type="button" aria-label="Scanner corporel"></button>

      <button class="hub-final-back" id="hubBackButton" type="button">← Changer d’avatar</button>
    </div>

    <div class="engine-panel" id="enginePanel" hidden>
      <div class="engine-panel-card">
        <button id="enginePanelClose" type="button" aria-label="Fermer">×</button>
        <span>AGENT SPÉCIALISÉ ATLAS</span>
        <h2 id="enginePanelTitle">Module</h2>
        <p id="enginePanelText">Contenu du module.</p>
        <button id="enginePanelAction" type="button">Ouvrir le module →</button>
      </div>
    </div>
  </section>

</main>
<script src="./js/atlas-opening.js?v=9"></script>
</body>
</html>
